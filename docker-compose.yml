version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: ctbacktest_postgres
    environment:
      POSTGRES_USER: ctbacktest
      POSTGRES_PASSWORD: ctbacktest
      POSTGRES_DB: ctbacktest
    ports:
      - "5432:5432"
    volumes:
      - ctbacktest_pgdata:/var/lib/postgresql/data

volumes:
  ctbacktest_pgdata:
